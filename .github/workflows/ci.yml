name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ENVIRONMENT: test
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.1.3"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.4
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry config virtualenvs.in-project true && poetry install --with dev
      - name: pytest
        run: |
          set +e
          poetry run python -m pytest -m "not requires_data" --cov=src --cov-report=term --cov-report=xml 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          echo '### Testes' >> "$GITHUB_STEP_SUMMARY"
          tail -n 15 pytest.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          exit $code

  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry config virtualenvs.in-project true && poetry install --with dev
      - run: poetry run python -m scripts.make_synthetic_batches --out data/incoming
      - name: lote limpo deve passar (exit 0)
        run: poetry run python -m src.pipeline.cli validate data/incoming/good_batch.csv
      - name: lote ruim deve ser bloqueado (exit 2 esperado = job verde)
        run: |
          set +e
          poetry run python -m src.pipeline.cli validate data/incoming/bad_batch.csv
          code=$?
          echo "exit code: $code"
          test "$code" -eq 2

  drift-demo:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry config virtualenvs.in-project true && poetry install --with dev
      - run: poetry run python -m src.pipeline.cli demo --synthetic
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: demo_output/reports/
